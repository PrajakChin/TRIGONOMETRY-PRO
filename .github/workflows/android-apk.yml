
name: Build TRIGONOMETRY PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/trigonometrypro/app
          mkdir -p app/src/main/assets/www

          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p app/src/main/res/$d
            cp ic_launcher.png app/src/main/res/$d/
          done

          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt app/src/main/java/com/trigonometrypro/app/

          cp index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png app/src/main/assets/www/
          cp ./*.txt app/src/main/assets/www/ || true

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.trigonometrypro.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.trigonometrypro.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1323
                  versionName = "13.2.3"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TRIGONOMETRY-PRO-V13.2.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
